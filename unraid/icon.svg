<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c6cff"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/>
      <stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect width="512" height="512" rx="116" fill="url(#shine)"/>
  <!-- waveform -->
  <g fill="#fff">
    <rect x="76"  y="226" width="28" height="60"  rx="14"/>
    <rect x="124" y="176" width="28" height="160" rx="14"/>
    <rect x="172" y="126" width="28" height="260" rx="14"/>
    <rect x="220" y="196" width="28" height="120" rx="14"/>
  </g>
  <!-- becoming text lines -->
  <g fill="#fff">
    <rect x="280" y="170" width="156" height="28" rx="14"/>
    <rect x="280" y="242" width="120" height="28" rx="14" opacity=".85"/>
    <rect x="280" y="314" width="140" height="28" rx="14" opacity=".7"/>
  </g>
</svg>
