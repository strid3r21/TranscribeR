<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · TranscribeR</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="login-page">
  <form class="login-card card" id="loginForm" autocomplete="on">
    <div class="brand login-brand">
      <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="12" width="3" height="8" rx="1.5"/><rect x="9" y="7" width="3" height="18" rx="1.5"/><rect x="15" y="3" width="3" height="26" rx="1.5"/><rect x="21" y="9" width="3" height="14" rx="1.5"/><rect x="27" y="13" width="3" height="6" rx="1.5"/></svg>
      <span>Transcribe<b>R</b></span>
    </div>
    <label class="form-row"><span>Username</span><input id="username" name="username" autocomplete="username" required autofocus></label>
    <label class="form-row"><span>Password</span><input id="password" name="password" type="password" autocomplete="current-password" required></label>
    <div class="login-error" id="loginError" role="alert"></div>
    <button class="btn primary" type="submit" id="loginBtn">Sign in</button>
    <p class="muted login-hint">Ask your admin for an account.</p>
  </form>
  <script src="login.js"></script>
</body>
</html>
