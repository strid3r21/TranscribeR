services:
  transcriber:
    image: ghcr.io/strid3r21/transcriber:latest
    # build: .            # or build locally instead of pulling
    container_name: transcriber
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
    environment:
      LLAMA_SWAP_URL: http://192.168.1.10:8080   # your llama-swap instance
      DEFAULT_MODEL: whisper                     # model name as defined in llama-swap config
      # LLAMA_SWAP_API_KEY: ""
      # DEFAULT_LANGUAGE: en
      # UPSTREAM_FORMAT: mp3                     # set to wav if your backend can't decode mp3
      # DIARIZATION: auto                       # off | auto | number of speakers
      # CHUNK_SECONDS: "30"
      # AUTO_TRANSCRIBE: "true"
      # UNCERTAINTY_THRESHOLD: "0.70"
      # WORD_THRESHOLD: "0.45"
